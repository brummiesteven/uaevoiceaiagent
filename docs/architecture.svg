<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="780" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="600" fill="#0f172a">Architecture — one scrape, three consumers, one repair loop</text>
  <text x="40" y="64" font-size="12" fill="#64748b">Every platform is load-bearing: remove it and the deployed system stops working.</text>

  <rect x="900" y="24" width="12" height="12" fill="none" stroke="#2563eb" stroke-width="2" rx="2"/>
  <text x="920" y="34" font-size="11" fill="#475569">Context.dev</text>
  <rect x="900" y="44" width="12" height="12" fill="none" stroke="#0f766e" stroke-width="2" rx="2"/>
  <text x="920" y="54" font-size="11" fill="#475569">ElevenLabs</text>
  <rect x="900" y="64" width="12" height="12" fill="none" stroke="#b45309" stroke-width="2" rx="2"/>
  <text x="920" y="74" font-size="11" fill="#475569">Devin</text>

  <!-- source -->
  <rect x="430" y="104" width="220" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="128" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Context.dev</text>
  <text x="540" y="145" font-size="11" fill="#475569" text-anchor="middle">crawl + structured extraction</text>

  <path d="M540,158 V196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- contract -->
  <rect x="390" y="196" width="300" height="58" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="540" y="220" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">content/schema.ts</text>
  <text x="540" y="239" font-size="11" fill="#475569" text-anchor="middle">the data contract — committed JSON</text>

  <!-- fan out -->
  <path d="M540,254 V286 H185 V318" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M540,254 V318" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M540,254 V286 H855 V318" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="548" y="278" font-size="10.5" fill="#64748b">one scrape, three consumers</text>

  <!-- consumers -->
  <rect x="60" y="318" width="250" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="185" y="342" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Next.js service pages</text>
  <text x="185" y="360" font-size="11" fill="#475569" text-anchor="middle">same JSON · WCAG AA</text>

  <rect x="415" y="318" width="250" height="58" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="540" y="342" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">ElevenLabs knowledge base</text>
  <text x="540" y="360" font-size="11" fill="#475569" text-anchor="middle">prose · built-in RAG</text>

  <rect x="730" y="318" width="250" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="855" y="342" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">MCP server /api/mcp</text>
  <text x="855" y="360" font-size="11" fill="#475569" text-anchor="middle">3 structured tools · under 1.5s</text>

  <!-- into agent -->
  <path d="M540,376 V440" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M855,376 V460 H692" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M230,376 V474 H388" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="240" y="466" font-size="10.5" fill="#64748b">embeds call widget</text>

  <!-- agent -->
  <rect x="390" y="440" width="300" height="68" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="540" y="468" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">ElevenLabs Agent</text>
  <text x="540" y="489" font-size="11" fill="#475569" text-anchor="middle">STT · LLM · TTS · turn-taking · RAG</text>

  <!-- to supabase -->
  <path d="M540,508 V556" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="552" y="537" font-size="10.5" fill="#64748b">post-call webhook → transcript</text>
  <path d="M140,376 V585 H388" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="150" y="577" font-size="10.5" fill="#64748b">feedback form</text>

  <rect x="390" y="556" width="300" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="580" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Supabase</text>
  <text x="540" y="598" font-size="11" fill="#475569" text-anchor="middle">call_feedback · tickets</text>

  <path d="M540,614 V666" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#am)"/>

  <!-- repair loop -->
  <rect x="390" y="666" width="300" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="540" y="690" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Linear issue → Devin session</text>
  <text x="540" y="708" font-size="11" fill="#475569" text-anchor="middle">note + transcript + service</text>

  <path d="M690,695 H750" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#am)"/>

  <rect x="750" y="666" width="270" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="885" y="690" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">PR → merge → sync-agent.ts</text>
  <text x="885" y="708" font-size="10.5" fill="#475569" text-anchor="middle">agent-config/prompt.md · content/</text>

  <path d="M1020,695 H1060 V490 H692" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#am)"/>
  <text transform="translate(1052,600) rotate(-90)" text-anchor="middle" font-size="10.5" fill="#b45309">merge re-syncs the live agent</text>

  <text x="40" y="758" font-size="11" fill="#64748b">No orchestrator sits between MCP and the agent — an extra LLM round-trip inside a real-time voice loop costs more than it returns.</text>
</svg>
