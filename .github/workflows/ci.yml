name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Catches an unfilled [FILL] in the prompt or knowledge base on the PR itself,
      # rather than after merge when the sync has already pushed it to the live agent.
      - run: npm run sync:agent:check
